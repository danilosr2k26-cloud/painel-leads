<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Leads</title>
<style>
  :root {
    --surface: #fcfcfb; --plane: #f4f4f1; --card: #ffffff;
    --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,.10);
    --series: #2a78d6; --series-soft: #cde2fb;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --radius: 14px;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19; --plane: #0d0d0d; --card: #1f1f1e;
      --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,.10);
      --series: #3987e5; --series-soft: #184f95;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); background: var(--plane); color: var(--ink); font-size: 15px; }
  a { color: var(--series); }
  .esconde { display: none !important; }

  /* ---------- LOGIN ---------- */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; box-shadow: 0 18px 44px rgba(0,0,0,.10); }
  .login-card h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .login-card p { color: var(--ink2); margin: 0 0 22px; font-size: .95rem; }
  label { display: block; font-weight: 600; font-size: .88rem; margin-bottom: 6px; }
  input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--baseline); border-radius: 10px; font: inherit; background: var(--surface); color: var(--ink); }
  input:focus, select:focus { outline: 2px solid var(--series); border-color: transparent; }
  .campo { margin-bottom: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--series); color: #fff; border: 0; padding: 11px 18px; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn:hover { filter: brightness(.94); }
  .btn.ghost { background: transparent; color: var(--ink2); border: 1px solid var(--baseline); }
  .btn.small { padding: 7px 12px; font-size: .86rem; }
  .erro { color: var(--critical); font-size: .9rem; margin-top: 10px; min-height: 18px; }

  /* ---------- LAYOUT ---------- */
  header.top { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 22px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 5; }
  header.top .marca { font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 10px; }
  header.top .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--series); }
  header.top .dir { display: flex; align-items: center; gap: 12px; color: var(--ink2); font-size: .9rem; }
  main { max-width: 1180px; margin: 0 auto; padding: 22px; }

  /* ---------- KPIs ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .kpi .rot { color: var(--muted); font-size: .82rem; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .kpi .val { font-size: 2rem; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .kpi .val.good { color: var(--good); } .kpi .val.series { color: var(--series); }

  /* ---------- CARD / GRÁFICO ---------- */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
  .card h2 { font-size: 1.05rem; margin: 0 0 4px; }
  .card .sub { color: var(--ink2); font-size: .86rem; margin: 0 0 16px; }
  #chart { width: 100%; height: 220px; display: block; }
  #chart rect.bar { transition: opacity .15s; cursor: pointer; }
  #chart rect.bar:hover { opacity: .78; }
  .tt { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); padding: 6px 9px; border-radius: 8px; font-size: .8rem; opacity: 0; transform: translate(-50%,-100%); white-space: nowrap; z-index: 20; }

  /* ---------- FILTROS ---------- */
  .filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .filtros .chips { display: flex; gap: 6px; }
  .chip { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--baseline); background: var(--card); cursor: pointer; font-size: .86rem; font-weight: 600; color: var(--ink2); }
  .chip.on { background: var(--series); color: #fff; border-color: var(--series); }
  .filtros input[type=search], .filtros input[type=date] { width: auto; }
  .filtros .cresce { flex: 1; min-width: 160px; }
  .filtros .cresce input { width: 100%; }

  /* ---------- TABELA ---------- */
  .tabela-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .4px; position: sticky; top: 0; background: var(--card); }
  tr:last-child td { border-bottom: 0; }
  td .msg { max-width: 260px; color: var(--ink2); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; }
  .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
  .badge.novo { background: color-mix(in srgb, var(--series) 14%, transparent); color: var(--series); }
  .badge.novo::before { background: var(--series); }
  .badge.contatado { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
  .badge.contatado::before { background: var(--good); }
  .badge.descartado { background: color-mix(in srgb, var(--critical) 14%, transparent); color: var(--critical); }
  .badge.descartado::before { background: var(--critical); }
  td.acoes { white-space: nowrap; }
  .ico-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--baseline); background: var(--card); cursor: pointer; text-decoration: none; color: var(--ink2); margin-right: 4px; }
  .ico-btn.wpp { color: #fff; background: #25d366; border-color: #25d366; }
  .ico-btn:hover { filter: brightness(.95); }
  td select { padding: 6px 8px; font-size: .82rem; width: auto; }
  .vazio { text-align: center; padding: 44px; color: var(--muted); }

  @media (max-width: 820px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    td .msg { max-width: 160px; }
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <form class="login-card" id="form-login">
    <h1>Painel de Leads</h1>
    <p>Entre para ver os cadastros recebidos.</p>
    <div class="campo"><label>Usuário</label><input id="in-user" autocomplete="username" value="admin"></div>
    <div class="campo"><label>Senha</label><input id="in-pass" type="password" autocomplete="current-password"></div>
    <button class="btn" style="width:100%">Entrar</button>
    <div class="erro" id="login-erro"></div>
  </form>
</div>

<!-- ================= APP ================= -->
<div id="app" class="esconde">
  <header class="top">
    <div class="marca"><span class="dot"></span> Painel de Leads</div>
    <div class="dir"><span id="quem"></span><button class="btn ghost small" id="btn-sair">Sair</button></div>
  </header>

  <main>
    <div class="kpis">
      <div class="kpi"><div class="rot">Total</div><div class="val" id="k-total">–</div></div>
      <div class="kpi"><div class="rot">Novos</div><div class="val series" id="k-novos">–</div></div>
      <div class="kpi"><div class="rot">Hoje</div><div class="val" id="k-hoje">–</div></div>
      <div class="kpi"><div class="rot">Contatados</div><div class="val good" id="k-cont">–</div></div>
    </div>

    <div class="card">
      <h2>Leads por dia</h2>
      <p class="sub">Últimos 14 dias</p>
      <svg id="chart" viewBox="0 0 720 220" preserveAspectRatio="none" role="img" aria-label="Leads por dia nos últimos 14 dias"></svg>
    </div>

    <div class="filtros">
      <div class="chips" id="chips">
        <span class="chip on" data-status="todos">Todos</span>
        <span class="chip" data-status="novo">Novos</span>
        <span class="chip" data-status="contatado">Contatados</span>
        <span class="chip" data-status="descartado">Descartados</span>
      </div>
      <div class="cresce"><input type="search" id="busca" placeholder="Buscar por nome, e-mail, telefone…"></div>
      <input type="date" id="de" title="De">
      <input type="date" id="ate" title="Até">
      <button class="btn ghost small" id="btn-atualizar">Atualizar</button>
      <button class="btn small" id="btn-csv">Exportar CSV</button>
    </div>

    <div class="tabela-wrap">
      <table>
        <thead>
          <tr>
            <th>Data</th><th>Nome</th><th>Telefone</th><th>E-mail</th>
            <th>Cidade</th><th>Mensagem</th><th>Status</th><th>Ações</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="vazio esconde" id="vazio">Nenhum lead encontrado.</div>
    </div>
  </main>
</div>

<div class="tt" id="tt"></div>

<script>
(() => {
  "use strict";
  const API = ""; // mesma origem (o servidor serve o painel)
  const $ = (s) => document.querySelector(s);
  let token = sessionStorage.getItem("painel_token") || "";
  let filtroStatus = "todos";

  /* ---------- helpers ---------- */
  async function api(caminho, opts = {}) {
    opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    if (token) opts.headers.Authorization = "Bearer " + token;
    const r = await fetch(API + caminho, opts);
    if (r.status === 401) { sair(); throw new Error("Sessão expirada"); }
    return r;
  }
  const fmtData = (iso) => { const d = new Date(iso); return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); };
  const soDigitos = (s) => String(s || "").replace(/\D/g, "");
  function campo(dados, ...nomes) {
    for (const n of nomes) { for (const k in dados) if (k.toLowerCase() === n) return dados[k]; }
    return "";
  }
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

  /* ---------- login ---------- */
  $("#form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("#login-erro").textContent = "";
    try {
      const r = await fetch(API + "/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ usuario: $("#in-user").value, senha: $("#in-pass").value }),
      });
      const j = await r.json();
      if (!j.ok) throw new Error(j.erro || "Falha no login");
      token = j.token; sessionStorage.setItem("painel_token", token);
      $("#quem").textContent = j.usuario;
      entrar();
    } catch (err) { $("#login-erro").textContent = err.message; }
  });
  function sair() { token = ""; sessionStorage.removeItem("painel_token"); $("#app").classList.add("esconde"); $("#login").classList.remove("esconde"); }
  $("#btn-sair").addEventListener("click", sair);

  function entrar() {
    $("#login").classList.add("esconde");
    $("#app").classList.remove("esconde");
    carregarStats(); carregarLeads();
  }

  /* ---------- KPIs + gráfico ---------- */
  async function carregarStats() {
    const j = await (await api("/api/stats")).json();
    $("#k-total").textContent = j.total;
    $("#k-novos").textContent = j.novos;
    $("#k-hoje").textContent = j.hoje;
    $("#k-cont").textContent = j.contatados;
    desenharGrafico(j.porDia);
  }

  function desenharGrafico(dados) {
    const svg = $("#chart");
    const W = 720, H = 220, padL = 34, padB = 26, padT = 10, padR = 8;
    const max = Math.max(1, ...dados.map((d) => d.n));
    const cw = (W - padL - padR) / dados.length;
    const bw = Math.min(cw - 6, 38);
    const plotH = H - padT - padB;
    const y = (v) => padT + plotH - (v / max) * plotH;
    const css = getComputedStyle(document.documentElement);
    const cor = css.getPropertyValue("--series").trim();
    const grid = css.getPropertyValue("--grid").trim();
    const muted = css.getPropertyValue("--muted").trim();
    let s = "";
    // gridlines + rótulos Y (0, meio, max)
    [0, Math.round(max / 2), max].forEach((v) => {
      const yy = y(v);
      s += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="${grid}" stroke-width="1"/>`;
      s += `<text x="${padL - 6}" y="${yy + 4}" text-anchor="end" font-size="10" fill="${muted}">${v}</text>`;
    });
    // barras
    dados.forEach((d, i) => {
      const x = padL + i * cw + (cw - bw) / 2;
      const h = Math.max(0, y(0) - y(d.n));
      const yy = y(d.n);
      const r = Math.min(4, bw / 2, h);
      // barra com topo arredondado (path)
      s += `<path class="bar" data-i="${i}" d="M${x},${yy + h} L${x},${yy + r} Q${x},${yy} ${x + r},${yy} L${x + bw - r},${yy} Q${x + bw},${yy} ${x + bw},${yy + r} L${x + bw},${yy + h} Z" fill="${cor}"/>`;
      // rótulo X a cada 2 dias
      if (i % 2 === 0) {
        const dd = d.dia.slice(8) + "/" + d.dia.slice(5, 7);
        s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="10" fill="${muted}">${dd}</text>`;
      }
    });
    svg.innerHTML = s;
    // hover
    const tt = $("#tt");
    svg.querySelectorAll(".bar").forEach((el) => {
      const d = dados[+el.dataset.i];
      el.addEventListener("mousemove", (ev) => {
        tt.style.opacity = 1; tt.style.left = ev.clientX + "px"; tt.style.top = (ev.clientY - 10) + "px";
        tt.textContent = new Date(d.dia + "T00:00").toLocaleDateString("pt-BR") + ": " + d.n + (d.n === 1 ? " lead" : " leads");
      });
      el.addEventListener("mouseleave", () => { tt.style.opacity = 0; });
    });
  }

  /* ---------- tabela ---------- */
  async function carregarLeads() {
    const p = new URLSearchParams();
    if (filtroStatus !== "todos") p.set("status", filtroStatus);
    if ($("#busca").value.trim()) p.set("q", $("#busca").value.trim());
    if ($("#de").value) p.set("from", $("#de").value);
    if ($("#ate").value) p.set("to", $("#ate").value);
    const j = await (await api("/api/leads?" + p.toString())).json();
    const tb = $("#tbody"); tb.innerHTML = "";
    $("#vazio").classList.toggle("esconde", j.leads.length > 0);
    j.leads.forEach((l) => {
      const d = l.dados || {};
      const nome = campo(d, "nome", "name") || "—";
      const tel = campo(d, "telefone", "whatsapp", "celular", "phone");
      const email = campo(d, "email", "e-mail", "mail");
      const cidade = campo(d, "cidade", "city");
      const msg = campo(d, "mensagem", "message", "obs");
      const wpp = soDigitos(tel);
      const tr = document.createElement("tr");
      tr.innerHTML =
        `<td style="white-space:nowrap">${fmtData(l.criadoEm)}</td>` +
        `<td><strong>${esc(nome)}</strong></td>` +
        `<td style="white-space:nowrap">${esc(tel || "—")}</td>` +
        `<td>${esc(email || "—")}</td>` +
        `<td>${esc(cidade || "—")}</td>` +
        `<td><div class="msg">${esc(msg || "—")}</div></td>` +
        `<td><span class="badge ${l.status}">${l.status}</span></td>` +
        `<td class="acoes">` +
          (wpp ? `<a class="ico-btn wpp" title="Chamar no WhatsApp" target="_blank" href="https://wa.me/${wpp}">✆</a>` : "") +
          `<select data-id="${l.id}" class="sel-status" title="Mudar status">
             <option value="novo"${l.status === "novo" ? " selected" : ""}>Novo</option>
             <option value="contatado"${l.status === "contatado" ? " selected" : ""}>Contatado</option>
             <option value="descartado"${l.status === "descartado" ? " selected" : ""}>Descartado</option>
           </select>` +
          `<button class="ico-btn del" data-id="${l.id}" title="Excluir">🗑</button>` +
        `</td>`;
      tb.appendChild(tr);
    });
    tb.querySelectorAll(".sel-status").forEach((s) => s.addEventListener("change", async (e) => {
      await api("/api/leads/" + e.target.dataset.id, { method: "PATCH", body: JSON.stringify({ status: e.target.value }) });
      carregarStats(); carregarLeads();
    }));
    tb.querySelectorAll(".del").forEach((b) => b.addEventListener("click", async (e) => {
      if (!confirm("Excluir este lead?")) return;
      await api("/api/leads/" + e.currentTarget.dataset.id, { method: "DELETE" });
      carregarStats(); carregarLeads();
    }));
  }

  /* ---------- filtros ---------- */
  $("#chips").addEventListener("click", (e) => {
    const c = e.target.closest(".chip"); if (!c) return;
    document.querySelectorAll(".chip").forEach((x) => x.classList.remove("on"));
    c.classList.add("on"); filtroStatus = c.dataset.status; carregarLeads();
  });
  let t; $("#busca").addEventListener("input", () => { clearTimeout(t); t = setTimeout(carregarLeads, 300); });
  $("#de").addEventListener("change", carregarLeads);
  $("#ate").addEventListener("change", carregarLeads);
  $("#btn-atualizar").addEventListener("click", () => { carregarStats(); carregarLeads(); });
  $("#btn-csv").addEventListener("click", async () => {
    const r = await api("/api/export");
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "leads.csv"; a.click();
    URL.revokeObjectURL(a.href);
  });

  /* ---------- início ---------- */
  if (token) entrar();
})();
</script>
</body>
</html>
